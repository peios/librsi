# cbindgen configuration for librsi.
#
# ROLE: verification, not generation. The shipping API is the hand-written
# include/rsi/*.h headers (with their prose docs); this config regenerates a
# doc-stripped ABI *snapshot* from the Rust `extern "C"` surface so that any drift
# between the Rust ABI and those headers is caught mechanically. The snapshot lives
# at abi/rsi-abi.h and is checked by tools/verify-abi.sh. See abi/README.md.

language = "C"
header = "/* @generated by cbindgen from the Rust source — do not edit. */"
include_guard = "RSI_ABI_GENERATED_H"
cpp_compat = true
documentation = false
# Render `usize`/`isize` as size_t/ptrdiff_t (matching the hand-written headers).
usize_is_size_t = true
# Deterministic ordering so the committed snapshot diffs cleanly on regeneration.
sort_by = "Name"
# Tag-style structs (`struct X`, no typedef) — matches the hand-written headers and
# lets a descriptor struct and a same-named function coexist.
style = "tag"

# The RSI uapi types/constants this surface may reference are defined in <pkm/lcs.h>;
# ssize_t comes from <sys/types.h>. cbindgen does not parse the peios-uapi crate, so
# it emits any such types by name — make them resolvable by including the header.
sys_includes = ["stdint.h", "stddef.h", "stdbool.h", "sys/types.h", "pkm/lcs.h"]
no_includes = true

[parse]
# Only librsi itself defines the public surface; the uapi/libc types are external.
parse_deps = false

[export]
prefix = ""
