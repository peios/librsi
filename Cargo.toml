[package]
name = "librsi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Peios userspace C ABI library for implementing a registry source (RSI provider)"

[lib]
# Produces librsi.so (cdylib) and librsi.a (staticlib).
name = "rsi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Shared C-ABI substrate: the global allocator, the errno slot, the syscall/ioctl
# wrappers, and the getxattr/builder helpers (shared with libpeios).
peios-cabi = { git = "https://github.com/peios/peios-cabi.git" }
# The LCS semantic core: RSI request parsers, status codes, the registry data model —
# the same pure (`core`-only) primitives the kernel uses, so the wire handling is
# guaranteed compatible. Userspace leaves the `kernel` feature off.
lcs-core = { git = "https://github.com/peios/pkm.git" }
# Generated Rust mirror of the PKM kernel ABI (RSI constants + #[repr(C)] structs —
# the Rust analog of `#include <pkm/*.h>`). no_std, definitions only.
peios-uapi = { git = "https://github.com/peios/pkm.git", default-features = false }
# Raw libc FFI for the errno constants the entry points report, the source-device
# open/close, and the `abort` in the panic handler. no_std.
libc = { version = "0.2", default-features = false }

# Nothing may unwind across the C ABI boundary.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Its own workspace root (peios-cabi is fetched via git; the pkm crates live in
# pkm/'s workspace).
[workspace]
