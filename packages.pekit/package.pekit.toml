# Shared metadata for the librsi package family. Version 0.1.1-1 is the first
# packaged release; there were no earlier packages, so nothing is replaced.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/librsi"
