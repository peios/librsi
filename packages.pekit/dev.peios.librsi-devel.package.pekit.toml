[package]
name        = "dev.peios.librsi-devel"
description = "Peios registry-source C ABI library development files"
# Headers and link metadata only: no linked crate code.
license     = "MIT"


[dependencies]
"dev.peios.librsi" = "= {{release}}"
# Public librsi headers include the Peios kernel UAPI under <pkm/lcs.h>.
"dev.peios.kernel-headers" = ">= 0.20.1-rc13-1"

[files]
"@source:LICENSE"                              = "usr/share/licenses/dev.peios.librsi-devel/LICENSE"
":usr/include/**"                              = "usr/include"
":usr/lib/x86_64-linux-peios/librsi.so"        = "usr/lib/x86_64-linux-peios/librsi.so"
":usr/lib/x86_64-linux-peios/pkgconfig/rsi.pc" = "usr/lib/x86_64-linux-peios/pkgconfig/rsi.pc"
